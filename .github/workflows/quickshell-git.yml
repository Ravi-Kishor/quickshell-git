name: Build dux-qt-base

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: dux-qt-base-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      # -------------------------
      # Update system
      # -------------------------
      - name: Update system
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git curl sudo github-cli zstd

      # -------------------------
      # Install dependencies
      # (cpptrace + jemalloc not needed: CRASH_HANDLER/USE_JEMALLOC default OFF)
      # -------------------------
      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            cmake ninja pkgconf cli11 \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-shadertools \
            spirv-tools wayland wayland-protocols \
            libdrm libxkbcommon libxcb libpipewire \
            mesa libglvnd vulkan-headers vulkan-icd-loader \
            pam polkit glib2 base-devel git go tar gzip coreutils findutils pipewire

      # -------------------------
      # Create builder
      # -------------------------
      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # -------------------------
      # Generate PKGBUILD
      # -------------------------
      - name: Create dux-qt-base PKGBUILD
        run: |
          mkdir -p /home/builder/pkg
          cat > /home/builder/pkg/PKGBUILD <<'EOF'
          pkgname=dux-qt-base
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Quickshell runtime built as a shared library (libdux-qt-base.so)"
          arch=(x86_64)
          url="https://github.com/duxlabs-dev/dux-qt-base"
          license=(LGPL-3.0-only)
          options=(!debug !lto !docs !libtool !staticlibs strip)

          makedepends=(
            cmake
            ninja
            pkgconf
            cli11
            git
            qt6-base
            qt6-declarative
            qt6-wayland
            qt6-shadertools
            qt6-svg
            spirv-tools
            wayland
            wayland-protocols
            vulkan-headers
            libdrm
            libxkbcommon
            libxcb
            libpipewire
            mesa
            libglvnd
            pam
            polkit
            glib2
          )

          source=("dux-qt-base::git+https://github.com/duxlabs-dev/dux-qt-base.git#branch=master")
          sha256sums=('SKIP')

          pkgver() {
            cd "$srcdir/dux-qt-base"
            if git describe --long --tags --abbrev=7 >/dev/null 2>&1; then
              git describe --long --tags --abbrev=7 \
                | sed 's/^v//;s/-/.r/;s/-/./'
            else
              printf "r%s.%s" \
                "$(git rev-list --count HEAD)" \
                "$(git rev-parse --short=7 HEAD)"
            fi
          }

          build() {
            cd "$srcdir/dux-qt-base"

            # Zen 3 (Ryzen 5600GT): fast code, no debug info, dead code stripped
            _flags="-O3 -g0 -pipe -march=znver3 -mtune=znver3 -fno-plt -fno-semantic-interposition -ffunction-sections -fdata-sections"
            _ldflags="-flto=auto -Wl,-O1 -Wl,--as-needed -Wl,--gc-sections -Wl,--sort-common -Wl,--hash-style=gnu -Wl,-s"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DDISTRIBUTOR="GitHub Actions (dux-qt-base)" \
              -DGIT_REVISION="$(git rev-parse HEAD)" \
              -DCMAKE_C_FLAGS="$_flags" \
              -DCMAKE_CXX_FLAGS="$_flags" \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -g0 -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g0 -DNDEBUG" \
              -DCMAKE_SHARED_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

            cmake --build build --parallel "$(nproc)"
          }

          package() {
            depends=(
              gcc-libs
              glibc
              libdrm
              libxkbcommon
              libxcb
              libpipewire
              libglvnd
              mesa
              pam
              polkit
              glib2
              qt6-base
              qt6-declarative
              qt6-wayland
              wayland
            )
            optdepends=('qt6-svg: svg images and icons')
            provides=(quickshell)
            conflicts=(dux-qt-base-git dux-qt-base-git-devel dux-qt-base-bin)
            replaces=(dux-qt-base-git dux-qt-base-git-devel)

            cd "$srcdir/dux-qt-base"
            DESTDIR="$pkgdir" cmake --install build

            # runtime = .so.0 + .so.<version> only
            rm -rf "$pkgdir/usr/include" "$pkgdir/usr/lib/pkgconfig"
            rm -f "$pkgdir/usr/lib/libdux-qt-base.so"
          }
          EOF

      # -------------------------
      # Show effective flags (proves this yml version is the one running)
      # -------------------------
      - name: Show build flags
        run: |
          echo "yml-version: gcc-o3-znver3-lto-small-v7"
          grep -nE 'march|FLAGS_RELEASE|INTERPROCEDURAL|options=' /home/builder/pkg/PKGBUILD || true

      # -------------------------
      # Build package
      # -------------------------
      - name: Build dux-qt-base packages
        run: |
          # smallest possible package: zstd ultra compression
          sed -i 's/^COMPRESSZST=.*/COMPRESSZST=(zstd -c -T0 --ultra -22 -)/' /etc/makepkg.conf
          chown -R builder:builder /home/builder
          su builder -c '
            export PACKAGER="Ravi Kishor <github@ravi>"
            export MAKEFLAGS="-j$(nproc)"
            cd ~/pkg
            makepkg -s --noconfirm
          '

      # -------------------------
      # Prepare release
      # -------------------------
      - name: Prepare release files
        id: pkg
        run: |
          mkdir -p release
          cp /home/builder/pkg/*.pkg.tar.zst release/

          RUNTIME_PKG=$(ls release/dux-qt-base-*.pkg.tar.zst | head -n1)
          VERSION=$(pacman -Qp "$RUNTIME_PKG" | awk '{print $2}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Upload artifact
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dux-qt-base-release
          path: release/*.pkg.tar.zst

      # -------------------------
      # Remove old devel / -git assets from the release (if it exists)
      # -------------------------
      - name: Remove old assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pkg.outputs.version }}-znver3
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^dux-qt-base-git|-devel-' \
            | while read -r a; do gh release delete-asset "$TAG" "$a" -y; done || true

      # -------------------------
      # GitHub Release
      # -------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-znver3
          name: dux-qt-base ${{ steps.pkg.outputs.version }} (znver3)
          files: release/*.pkg.tar.zst
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
