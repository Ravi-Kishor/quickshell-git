name: Build dux-qt-base - Zen 3

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a release for the current upstream commit exists"
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dux-qt-base-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/duxlabs-dev/dux-qt-base.git

jobs:
  check:
    name: Resolve upstream and skip if already released
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      short: ${{ steps.resolve.outputs.short }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve upstream HEAD and check for existing release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          COMMIT="$(git ls-remote "$UPSTREAM_REPO" refs/heads/master | awk '{print $1}')"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: could not resolve upstream master HEAD"
            exit 1
          }

          SHORT="${COMMIT:0:7}"
          SKIP=false

          # Match both "<ver>.<short>-1-znver3" and "<ver>.<short>-znver3"
          if [[ "$FORCE" != "true" ]] && \
             gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName -q '.[].tagName' \
             | grep -Eq "${SHORT}(-[0-9]+)?-znver3"; then
            SKIP=true
          fi

          {
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: $COMMIT ($SHORT) | Skip: $SKIP"

  build:
    name: Build dux-qt-base (znver3 / Fat LTO)
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      UPSTREAM_COMMIT: ${{ needs.check.outputs.commit }}

    steps:
      - name: Update system and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --noprogressbar archlinux-keyring
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --noconfirm --needed --noprogressbar \
            base-devel git curl sudo github-cli zstd ccache \
            cmake ninja pkgconf cli11 \
            qt6-base qt6-declarative qt6-svg qt6-wayland qt6-shadertools \
            spirv-tools wayland wayland-protocols \
            libdrm libxkbcommon libxcb libpipewire pipewire \
            mesa libglvnd vulkan-headers vulkan-icd-loader \
            pam polkit glib2

          useradd -m builder
          install -d -o builder -g builder /home/builder/pkg /home/builder/.cache/ccache

      - name: Cache ccache for faster C++/Qt6 rebuilds
        uses: actions/cache@v4
        with:
          path: /home/builder/.cache/ccache
          key: dux-qt-base-ccache-znver3-o2-fatlto-${{ needs.check.outputs.commit }}
          restore-keys: |
            dux-qt-base-ccache-znver3-o2-fatlto-

      - name: Pre-clone upstream and create PKGBUILD
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" /home/builder/pkg/src/dux-qt-base
          git -C /home/builder/pkg/src/dux-qt-base checkout --detach "$UPSTREAM_COMMIT"
          git -C /home/builder/pkg/src/dux-qt-base submodule update --init --recursive --depth 1

          cat > /home/builder/.makepkg.conf <<'EOF'
          PACKAGER="Ravi Kishor <github@ravi>"
          MAKEFLAGS="-j$(nproc)"
          COMPRESSZST=(zstd -c -T0 --ultra -20 -)
          PKGEXT='.pkg.tar.zst'
          EOF

          cat > /home/builder/pkg/PKGBUILD <<'EOF'
          pkgname=dux-qt-base
          pkgver=0.0.0
          pkgrel=1
          pkgdesc="Quickshell runtime built as a shared library (libdux-qt-base.so, Zen 3 / 5600GT / Fat LTO)"
          arch=(x86_64)
          url="https://github.com/duxlabs-dev/dux-qt-base"
          license=(LGPL-3.0-only)
          options=(!debug !lto !docs !libtool !staticlibs strip)

          makedepends=(
            cmake ninja pkgconf cli11 git
            qt6-base qt6-declarative qt6-wayland qt6-shadertools qt6-svg
            spirv-tools wayland wayland-protocols vulkan-headers
            libdrm libxkbcommon libxcb libpipewire mesa libglvnd pam polkit glib2
          )

          pkgver() {
            cd "$srcdir/dux-qt-base"
            if git describe --long --tags --abbrev=7 >/dev/null 2>&1; then
              git describe --long --tags --abbrev=7 | sed 's/^v//;s/-/.r/;s/-/./'
            else
              printf "r%s.%s" "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
            fi
          }

          build() {
            cd "$srcdir/dux-qt-base"

            # Prevent Arch's default makepkg flags (including Intel CET -fcf-protection) from leaking in
            unset CFLAGS CXXFLAGS LDFLAGS

            # Ryzen 5 5600GT (Zen 3 / Cezanne) + Monolithic ("Fat") GCC LTO:
            # - -O2 + single-partition LTO (-flto-partition=one): full cross-TU inlining,
            #   devirtualization, and dead-code removal while keeping hot code inside L1i/L3
            # - -fno-fat-lto-objects: emits slim GIMPLE IR (faster compile & smaller ccache)
            # - -fdevirtualize-at-ltrans -fno-semantic-interposition: devirtualizes Qt C++ calls across LTO
            # - -fvisibility-inlines-hidden: trims Qt template/inline exports from .dynsym
            # - -fcf-protection=none: avoids useless Intel CET endbr64 padding on Zen 3
            _cflags="-O2 -g0 -pipe -march=znver3 -mtune=znver3 -fcf-protection=none \
              -flto -fno-fat-lto-objects \
              -fno-plt -fno-semantic-interposition -fdevirtualize-at-ltrans \
              -fno-math-errno -fno-trapping-math -ffunction-sections -fdata-sections"

            _cxxflags="${_cflags} -fvisibility-inlines-hidden"

            _ldflags="-O2 -march=znver3 -mtune=znver3 \
              -flto -flto-partition=one -fdevirtualize-at-ltrans \
              -Wl,-O1 -Wl,--as-needed -Wl,--gc-sections -Wl,--sort-common \
              -Wl,--hash-style=gnu -Wl,-Bsymbolic-functions -Wl,-z,pack-relative-relocs \
              -Wl,-z,relro -Wl,-z,now -Wl,-s"

            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCRASH_HANDLER=OFF \
              -DDISTRIBUTOR="GitHub Actions (dux-qt-base znver3 fat-lto)" \
              -DGIT_REVISION="$(git rev-parse HEAD)" \
              -DCMAKE_C_FLAGS="$_cflags" \
              -DCMAKE_CXX_FLAGS="$_cxxflags" \
              -DCMAKE_C_FLAGS_RELEASE="-DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-DNDEBUG" \
              -DCMAKE_SHARED_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_MODULE_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_EXE_LINKER_FLAGS="$_ldflags" \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

            cmake --build build --parallel "$(nproc)"
          }

          package() {
            depends=(
              gcc-libs glibc libdrm libxkbcommon libxcb libpipewire
              libglvnd mesa pam polkit glib2 qt6-base qt6-declarative
              qt6-wayland wayland
            )
            optdepends=('qt6-svg: svg images and icons')
            provides=(quickshell dux-qt-base)
            conflicts=(dux-qt-base-git dux-qt-base-git-devel dux-qt-base-bin)
            replaces=(dux-qt-base-git dux-qt-base-git-devel)

            cd "$srcdir/dux-qt-base"
            DESTDIR="$pkgdir" cmake --install build

            # runtime = .so.0 + .so.<version> only
            rm -rf "$pkgdir/usr/include" "$pkgdir/usr/lib/pkgconfig"
            rm -f "$pkgdir/usr/lib/libdux-qt-base.so"
          }
          EOF

          chown -R builder:builder /home/builder

      - name: Show build flags
        shell: bash
        run: |
          echo "yml-version: gcc-o2-znver3-fatlto-5600gt-v12"
          grep -nE 'march|flto|FLAGS_RELEASE|INTERPROCEDURAL|CRASH_HANDLER|options=' /home/builder/pkg/PKGBUILD || true

      - name: Build dux-qt-base package
        shell: bash
        run: |
          set -euo pipefail
          su - builder -c '
            set -euo pipefail
            export CCACHE_DIR="/home/builder/.cache/ccache"
            export CCACHE_MAXSIZE="1G"
            export CCACHE_COMPILERCHECK="content"
            export CCACHE_SLOPPINESS="pch_defines,time_macros"
            cd ~/pkg
            makepkg --nodeps --noextract --clean --noconfirm
          '

      - name: Verify shared library and prepare release files
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp /home/builder/pkg/*.pkg.tar.zst release/

          RUNTIME_PKG="$(ls release/dux-qt-base-*.pkg.tar.zst | head -n1)"
          VERSION="$(pacman -Qp "$RUNTIME_PKG" | awk '{print $2}')"

          bsdtar -tf "$RUNTIME_PKG" | grep -E 'libdux-qt-base\.so'

          VERIFY_DIR=/home/builder/verify
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          bsdtar -xf "$RUNTIME_PKG" -C "$VERIFY_DIR"
          SO_FILE="$(find "$VERIFY_DIR/usr/lib" -maxdepth 1 -type f -name 'libdux-qt-base.so.*' | head -n1)"
          test -n "$SO_FILE"

          echo "Library & package sizes:"
          ls -lh "$SO_FILE" "$RUNTIME_PKG"

          echo "ELF hardening & RELR relocations:"
          readelf -d "$SO_FILE" | grep -E 'RELR|BIND_NOW|SYMBOLIC' || true

          if readelf -S "$SO_FILE" | grep -q '\.gnu\.lto_'; then
            echo "ERROR: Unfinalized LTO sections leaked into shared library."
            exit 1
          fi

          echo "Zen 3 AVX2/FMA sample instructions:"
          (set +o pipefail; objdump -d "$SO_FILE" | grep -Em 3 'vfmadd|ymm' || true)

          sha256sum "$RUNTIME_PKG" > "${RUNTIME_PKG}.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove old assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.pkg.outputs.version }}-znver3
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -E '^dux-qt-base-git|-devel-' \
            | while read -r a; do gh release delete-asset "$TAG" "$a" -y; done || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-znver3
          name: dux-qt-base ${{ steps.pkg.outputs.version }} (znver3)
          files: |
            release/*.pkg.tar.zst
            release/*.sha256
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
